name: Deploy PyTorch PH demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pytorch-ph-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: fit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PyTorchPH/PyTorchPH.github.io
          ref: 7082d8ee0620478fefb159cee46ae5947bee6987
          path: ph
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ph/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ph
      - run: npm run build --workspace @pytorch-ph/pages-demo
        working-directory: ph
        env:
          PAGES_BASE_PATH: /pytorch-fit-system
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ph/apps/pages-demo/out
      - id: deployment
        uses: actions/deploy-pages@v4
